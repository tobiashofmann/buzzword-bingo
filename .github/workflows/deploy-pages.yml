name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Point UI5 bootstrap to the public CDN
        run: |
          UI5_VERSION=$(node -p "require('./webapp/manifest.json')['sap.ui5'].dependencies.minUI5Version")
          sed -i "s#src=\"resources/sap-ui-core.js\"#src=\"https://ui5.sap.com/${UI5_VERSION}/resources/sap-ui-core.js\"#" dist/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
